name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kharcha-tracker.apk
      - name: Re-sign APK with fixed key
        run: |
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > $GITHUB_WORKSPACE/debug.keystore
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK_IN=$(find . -name "app-debug.apk" | head -1)
          echo "Build-tools: $BT, APK: $APK_IN"
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 "$APK_IN" $GITHUB_WORKSPACE/app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks $GITHUB_WORKSPACE/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out $GITHUB_WORKSPACE/kharcha-signed.apk $GITHUB_WORKSPACE/app-aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs $GITHUB_WORKSPACE/kharcha-signed.apk
          cp $GITHUB_WORKSPACE/kharcha-signed.apk $GITHUB_WORKSPACE/kharcha-tracker.apk
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kharcha Tracker APK
          body: "Kharcha Tracker Android app. Download kharcha-tracker.apk and install it on any Android phone."
          files: kharcha-tracker.apk
